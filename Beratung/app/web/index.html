<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E7D32">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/img/icon.svg">
<link rel="stylesheet" href="/css/app.css">
<title>Anmelden · Ganzheitliche Finanzberatung</title>
</head>
<body>
<div class="wrap" style="max-width:440px">
<div class="top"><div class="marke"><svg height="30" viewBox="0 0 60 60" style="display:block"><path d="M30 4 L56 22 L4 22 Z" fill="#2E7D32"/><rect x="10" y="25" width="15" height="19" rx="2" fill="#7CC243"/><rect x="35" y="25" width="15" height="19" rx="2" fill="#7CC243"/><rect x="4" y="47" width="52" height="8" rx="2" fill="#2E7D32"/></svg><span>Ganzheitliche Finanzberatung</span></div></div>
<div class="card">
  <h1>Anmelden</h1>
  <form id="login" novalidate>
    <label for="email">E-Mail</label><input id="email" type="email" autocomplete="username" required>
    <label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" required>
    <div class="nav"><button class="primary" type="submit">Anmelden</button></div>
    <p class="err" id="fehler" role="alert"></p>
  </form>
</div>
<p class="hint">Neu hier? Du bekommst von uns einen persönlichen Einladungslink.<br>Passwort vergessen? Schreib uns kurz, dann bekommst du einen neuen Link.</p>
<footer><span class="ph">[Impressum]</span> · <span class="ph">[Datenschutz]</span></footer>
</div>
<script src="/js/api.js"></script>
<script src="/js/login.js"></script>
</body></html>
