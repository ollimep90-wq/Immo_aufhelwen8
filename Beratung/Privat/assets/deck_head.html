<style>
/* Gemeinsamer Folienstil (aus Kundenpräsentation übernommen). Keynote-artige Folien 16:9: viel Weißraum, eine Aussage pro Folie, Grün aus dem Logo als einziger Akzent */
:root{
  --ink:#1D1D1F; --ink2:#515154; --mute:#86868B; --line:#E5E5EA; --bg:#FFFFFF; --soft:#F5F5F7;
  --green:#2E8B3E; --green-l:#E9F5EC; --blue:#3F6FB0; --blue-l:#EAF0F9; --night:#0B1410;
  --display:"Inter Display","Inter",system-ui,sans-serif; --text:"Inter",system-ui,sans-serif;
}
@page{size:297mm 167mm;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--text);color:var(--ink);background:var(--bg);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.s{width:297mm;height:167mm;padding:15mm 18mm;position:relative;overflow:hidden;page-break-after:always;background:var(--bg)}
.s:last-child{page-break-after:auto}
.eyebrow{font-size:9pt;font-weight:600;color:var(--green);letter-spacing:.02em;margin-bottom:3mm}
h1{font-family:var(--display);font-weight:700;font-size:34pt;line-height:1.05;letter-spacing:-.025em;text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:24pt;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h3{font-family:var(--display);font-weight:650;font-size:13pt;letter-spacing:-.01em;margin-bottom:1.5mm}
.sub{font-size:13pt;line-height:1.4;color:var(--ink2);max-width:200mm;margin-top:4mm}
p,li{font-size:10pt;line-height:1.45;color:var(--ink2)}
.grey{color:var(--mute)}
.fine{font-size:7pt;line-height:1.4;color:var(--mute)}
.row{display:flex;gap:7mm}
.col{flex:1;min-width:0}
.tile{background:var(--soft);border-radius:5mm;padding:7mm 6mm}
.ic{width:13mm;height:13mm;color:var(--green);margin-bottom:4mm;display:block}
.ic.b{color:var(--blue)}
.big{font-family:var(--display);font-weight:700;letter-spacing:-.03em;line-height:1}
.grad{color:#4CAF50}
.foot{position:absolute;left:18mm;right:18mm;bottom:7mm;display:flex;justify-content:space-between;font-size:7pt;color:var(--mute)}
.pill{display:inline-block;font-size:8pt;font-weight:600;padding:1.2mm 3mm;border-radius:10mm;background:var(--green-l);color:var(--green)}
.legend{display:flex;gap:6mm;font-size:8.5pt;color:var(--ink2);align-items:center}
.sw{display:inline-block;width:3.2mm;height:3.2mm;border-radius:1mm;margin-right:1.5mm;vertical-align:-.4mm}
svg text{font-family:var(--text)}
</style></head><body>
